<title>Что передали?</title>
<style>
/* Токены — из app/style.css «Школы Морзе 73» (визуальная система «приёмник»). */
:root{
  color-scheme: light;
  --bg:#F6F1E6; --bg-2:#EDE4D1;
  --surface:#FFFFFF; --surface-2:#FAF4E8;
  --line:#E0D5BD; --line-strong:#C7B694;
  --text:#1E1A13; --text-dim:#544B3D;
  --accent:#9C6608; --accent-text:#8A5B06; --on-accent:#FFFFFF;
  --ok:#2C7548; --bad:#AC3F27; --on-ok:#FFFFFF;
  --tick-off:#9C8657;
  --glow:rgba(185,121,11,.16);
  --shadow:0 1px 2px rgba(62,46,18,.05), 0 10px 26px rgba(62,46,18,.09);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --r-lg:24px; --r:18px; --r-sm:12px; --r-pill:999px;
  --tap:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#100E0B; --bg-2:#191510;
    --surface:#1B1712; --surface-2:#241F17;
    --line:#332C21; --line-strong:#4C4230;
    --text:#F7F2E6; --text-dim:#B2A894;
    --accent:#F2A63C; --accent-text:#F6B863; --on-accent:#16100A;
    --ok:#5CC985; --bad:#FF8767; --on-ok:#0B1A10;
    --tick-off:#6E6249;
    --glow:rgba(242,166,60,.22);
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#100E0B; --bg-2:#191510;
  --surface:#1B1712; --surface-2:#241F17;
  --line:#332C21; --line-strong:#4C4230;
  --text:#F7F2E6; --text-dim:#B2A894;
  --accent:#F2A63C; --accent-text:#F6B863; --on-accent:#16100A;
  --ok:#5CC985; --bad:#FF8767; --on-ok:#0B1A10;
  --tick-off:#6E6249;
  --glow:rgba(242,166,60,.22);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px rgba(0,0,0,.45);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{
  margin:0; font-family:var(--font); background:var(--bg); color:var(--text);
  font-size:20px; line-height:1.45; -webkit-text-size-adjust:100%; overflow-x:hidden;
}
h2{font-size:27px; line-height:1.2; letter-spacing:-.015em; margin:0; font-weight:700; text-wrap:balance;}
h3{font-size:23px; line-height:1.25; margin:0; font-weight:700; text-wrap:balance;}
p{margin:0;}
button{font-family:inherit; font-size:20px; cursor:pointer; color:inherit;}
a{color:var(--accent-text); text-underline-offset:3px;}
:focus-visible{outline:3px solid var(--accent); outline-offset:3px; border-radius:6px;}
.f{fill:currentColor; stroke:none;}
.icon{flex:none; vertical-align:-.18em;}

.wrap{max-width:860px; margin:0 auto; padding-inline:16px; padding-block:12px 48px;}
.col{max-width:560px; margin:0 auto;}

.protoline{
  font-family:var(--mono); font-size:17px; font-weight:600; letter-spacing:.02em;
  color:var(--text-dim); text-align:center; line-height:1.3;
  border:1px dashed var(--line-strong); border-radius:var(--r-sm); padding:8px 12px;
}

/* ——— Разделы страницы ——— */
.tabs{display:flex; gap:4px; margin:12px auto 18px; padding:4px; max-width:560px;
  background:var(--bg-2); border:1px solid var(--line); border-radius:var(--r);}
.tabs button{flex:1 1 auto; hyphens:none; min-height:56px; border-radius:14px; border:1px solid transparent;
  background:none; color:var(--text-dim); font-weight:650; font-size:18px; line-height:1.15; padding:6px 4px;}
.tabs button[aria-selected="true"]{background:var(--surface); color:var(--text); border-color:var(--line-strong); box-shadow:var(--shadow);}

.eyebrow{font-family:var(--mono); font-size:17px; font-weight:600; letter-spacing:.12em;
  text-transform:uppercase; color:var(--text-dim); line-height:1.2;}
.muted{color:var(--text-dim);}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:16px;}
.stack{display:flex; flex-direction:column; gap:12px;}

/* ——— Кнопки как в приложении ——— */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:10px;
  min-height:var(--tap); padding:12px 20px; border:1px solid transparent; border-radius:var(--r);
  background:var(--accent); color:var(--on-accent); font-weight:650; letter-spacing:-.01em;
  box-shadow:var(--shadow); width:100%; text-decoration:none; text-align:center;
  transition:transform .1s ease, filter .15s ease;}
.btn:active{transform:translateY(1px) scale(.995); filter:brightness(.95);}
.btn.secondary{background:var(--surface); color:var(--accent-text); border-color:var(--line-strong);}
.btn.ghost{background:transparent; color:var(--text-dim); border-color:var(--line); box-shadow:none;}
.btn[aria-pressed="true"]{background:var(--surface-2); color:var(--text); border-color:var(--accent); border-width:2px;}
.btn-row{display:flex; gap:10px;}
.btn-row .btn{flex:1 1 0; min-width:0; padding-inline:10px;}
.linkbtn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  min-height:52px; padding:10px; border:none; background:none; color:var(--text-dim);
  font-size:19px; font-weight:600; text-decoration:underline; text-decoration-color:var(--line-strong);
  text-underline-offset:5px;}
.linkbtn.danger{color:var(--bad);}
.iconbtn{display:inline-flex; align-items:center; gap:6px; min-height:48px; padding:8px 14px;
  border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface);
  color:var(--text-dim); font-size:18px; font-weight:600;}

.screenbar{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:52px; margin-bottom:6px;}
.screenbar .title{text-align:right; min-width:0;}
.screenbar .title b{display:block; font-size:21px; line-height:1.2;}
.counter{font-size:17px; color:var(--text-dim);}

/* ——— Выбор категории ——— */
.intro{display:grid; grid-template-columns:84px 1fr; gap:14px; align-items:center; margin:4px 0 14px;}
.intro img{width:84px; height:auto; display:block;}
.cats{display:flex; flex-direction:column; gap:10px;}
.cat{display:grid; grid-template-columns:1fr auto; align-items:center; gap:4px 12px; text-align:left;
  width:100%; min-height:84px; padding:14px 16px; border-radius:var(--r);
  border:1px solid var(--line-strong); background:var(--surface); box-shadow:var(--shadow);}
.cat .nm{font-size:23px; font-weight:700; line-height:1.2;}
.cat .sub{grid-column:1; font-size:18px; color:var(--text-dim); line-height:1.3;}
.cat .cnt{grid-row:1 / span 2; grid-column:2; font-family:var(--mono); font-weight:700;
  color:var(--accent-text); font-size:19px; white-space:nowrap; font-variant-numeric:tabular-nums;}
.cat .tag{display:inline-block; margin-left:8px; font-size:17px; font-weight:650; color:var(--ok);}

/* ——— Экран вопроса ——— */
.question{font-size:28px; font-weight:750; text-align:center; letter-spacing:-.015em; margin:4px 0 0;}
.lamp{width:108px; height:108px; border-radius:50%; margin:14px auto 12px;
  background:var(--surface-2); border:1px solid var(--line); box-shadow:inset 0 0 0 8px var(--bg);
  transition:background .04s linear, transform .04s linear, box-shadow .04s linear;}
.lamp.on{background:var(--accent); box-shadow:0 0 0 16px var(--glow); transform:scale(1.04);}
.msgline{display:flex; flex-wrap:wrap; justify-content:center; gap:10px 22px; margin:4px 0 12px;}
.mword{display:flex; flex-wrap:wrap; justify-content:center; gap:4px;}
.mcell{min-width:30px; display:flex; flex-direction:column; align-items:center; gap:2px;}
.mcell .ch{min-width:30px; align-self:stretch; height:36px; border-bottom:3px solid var(--line-strong);
  font-family:var(--mono); font-size:26px; font-weight:700; line-height:36px; text-align:center; color:var(--text);}
.mcell .cd{display:flex; align-items:center; justify-content:center; height:7px; margin-top:8px; --u:7px;}
.withcode .mword{gap:12px;} .withcode{gap:18px 34px;}
.cd i{display:block; height:100%; border-radius:4px; background:var(--accent);}
.cd i.dit{width:var(--u);} .cd i.dah{width:calc(var(--u) * 3);} .cd i.g{width:4px; background:none;}
.mcell.now .ch{border-bottom-color:var(--accent); background:var(--glow); border-radius:6px 6px 0 0;}
.solved .mcell .ch{border-bottom-color:var(--ok);}
.feedback{min-height:32px; font-size:21px; font-weight:650; text-align:center; margin:4px 0 10px; text-wrap:balance;}
.feedback.no{color:var(--bad);}
.feedback.ok{color:var(--ok);}
.controls{display:flex; flex-direction:column; gap:10px;}
.controls .btn-row .btn{min-height:56px; font-size:19px;}

.opts{display:flex; flex-direction:column; gap:10px; margin-top:14px;}
.opt{width:100%; min-height:var(--tap); padding:14px 18px; text-align:left; font-size:22px; font-weight:650;
  border-radius:var(--r); border:1px solid var(--line-strong); background:var(--surface);
  box-shadow:var(--shadow); line-height:1.25;}
.opt:disabled{opacity:.35; box-shadow:none; text-decoration:line-through; text-decoration-color:var(--bad); cursor:default;}
.pics{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:14px;}
.pic{aspect-ratio:1/1; max-width:100%; min-height:96px; border-radius:var(--r); border:1px solid var(--line-strong);
  background:var(--surface); box-shadow:var(--shadow); display:grid; place-items:center; padding:8px; color:var(--text);}
.pic svg{width:72px; height:72px;}
.pic:disabled{opacity:.3; box-shadow:none; cursor:default;}
@media (max-width:339px){
  .pics{grid-template-columns:1fr;}
  .pic{aspect-ratio:auto; min-height:100px;}
}
.abc{margin-top:10px;}
.abcgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; margin-top:8px;}
.abcgrid div{border:1px solid var(--line-strong); border-radius:var(--r-sm); background:var(--surface);
  padding:6px 4px; text-align:center; font-size:26px; font-weight:700; line-height:1.2;}
.abcgrid small{display:block; font-family:var(--mono); font-size:20px; color:var(--accent-text); letter-spacing:1px;}

/* ——— Разгадка ——— */
.reveal{margin-top:14px; text-align:center;}
.verdict{display:flex; align-items:center; justify-content:center; gap:8px; color:var(--ok); font-size:26px; font-weight:750;}
.verdict.soft{color:var(--text-dim); font-size:21px;}
.bigtext{font-family:var(--mono); font-size:30px; font-weight:700; letter-spacing:.04em; line-height:1.3;
  margin:8px 0; word-break:break-word; color:var(--text);}
.revpic{display:flex; flex-direction:column; align-items:center; gap:4px; margin:6px 0; color:var(--text);}
.revpic svg{width:104px; height:104px;}
.revpic span{font-size:21px; font-weight:650;}
.story{text-align:left; margin-top:12px;}
.story .yr{display:inline-block; font-family:var(--mono); font-weight:700; font-size:19px;
  color:var(--accent-text); border:1px solid var(--line-strong); border-radius:var(--r-pill); padding:4px 14px;}
.story p{margin-top:10px;}
.reveal .btn-row{margin-top:14px;}

.endcard{text-align:center; padding:22px 16px;}
.score{font-family:var(--mono); font-size:52px; font-weight:700; color:var(--accent-text); line-height:1.1; margin:6px 0;}
.dots{display:flex; justify-content:center; gap:10px; margin:10px 0 4px;}
.dots i{width:22px; height:22px; border-radius:50%; background:var(--tick-off);}
.dots i.ok{background:var(--ok);}

/* ——— Настройки ——— */
.settings{margin-top:26px;}
.setrow{padding:12px 0; border-top:1px solid var(--line);}
.setrow:first-of-type{border-top:none;}
.setrow > label, .setrow > .lbl{display:block; font-weight:650; margin-bottom:8px;}
.speed{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; align-items:center;}
.speed output{grid-column:1 / -1; grid-row:1;}
.speed .btn{min-height:56px; font-size:18px; padding-inline:6px; white-space:nowrap;}
.speed output{font-family:var(--mono); font-weight:700; color:var(--accent-text); font-size:26px; text-align:center; line-height:1.15;}
.speed output small{display:inline; margin-left:6px;}
.speed output small{font-size:17px; color:var(--text-dim); font-weight:600;}
.rowflex{display:flex; align-items:center; justify-content:space-between; gap:12px;}
.toggle{flex:0 0 auto; width:76px; height:44px; padding:4px; border-radius:22px;
  border:1px solid var(--line-strong); background:var(--surface-2); display:flex; align-items:center;}
.toggle i{display:block; width:34px; height:34px; border-radius:50%; background:var(--text-dim); transition:transform .18s ease;}
.toggle[aria-checked="true"]{background:var(--accent); border-color:var(--accent);}
.toggle[aria-checked="true"] i{transform:translateX(32px); background:var(--surface);}
.seg{display:flex; gap:4px; padding:4px; background:var(--bg-2); border:1px solid var(--line); border-radius:var(--r);}
.seg button{flex:1 1 0; min-width:0; min-height:52px; border-radius:14px; border:1px solid transparent;
  background:none; color:var(--text-dim); font-weight:650; font-size:17px; line-height:1.15; padding:4px;}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--text); border-color:var(--line-strong); box-shadow:var(--shadow);}
.confirm{border:2px solid var(--bad); border-radius:var(--r); padding:14px; margin-top:8px; background:var(--surface);}
.confirm p{margin-bottom:10px;}
.hint{font-size:17px; color:var(--text-dim); margin-top:6px; line-height:1.4;}

/* ——— Все вопросы ——— */
.jump{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-bottom:8px;}
.jump .btn{min-height:52px; font-size:18px; padding:8px;}
.qcat{margin-top:26px;}
.qcat h2{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.qcat h2 small{font-family:var(--mono); font-size:17px; color:var(--text-dim); font-weight:600;}
.qlist{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:10px;}
.qitem{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; padding:12px 14px;}
.qitem .play{grid-row:1 / span 3; align-self:start; width:52px; height:52px; border-radius:50%;
  border:1px solid var(--line-strong); background:var(--surface-2); color:var(--accent-text);
  display:grid; place-items:center; padding:0;}
.qitem .play[aria-pressed="true"]{background:var(--accent); color:var(--on-accent); border-color:var(--accent);}
.qitem .no{font-family:var(--mono); font-size:17px; color:var(--text-dim); font-weight:600;}
.qitem .tx{font-family:var(--mono); font-size:21px; font-weight:700; letter-spacing:.03em; word-break:break-word; line-height:1.3;}
.qitem .ans{font-size:19px; line-height:1.4;}
.qitem .ans .r{color:var(--ok); font-weight:700;}
.qitem .ans .w{color:var(--text-dim);}
.qitem .more{grid-column:1 / -1; font-size:18px; margin-top:6px;}
.minipics{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}
.minipics span{display:flex; flex-direction:column; align-items:center; gap:0; font-size:17px; color:var(--text-dim);
  border:1px solid var(--line); border-radius:var(--r-sm); padding:6px 8px; min-width:80px;}
.minipics span.r{border-color:var(--ok); color:var(--ok); font-weight:650;}
.minipics svg{width:48px; height:48px; color:var(--text);}

/* ——— Где в приложении ——— */
.variants{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr)); gap:24px; margin-top:16px;}
.vhead{margin-bottom:10px;}
.vhead .badge{display:inline-block; font-size:17px; font-weight:700; border-radius:var(--r-pill); padding:3px 12px;
  background:var(--ok); color:var(--on-ok); margin-left:6px; vertical-align:3px;}
.vhead p{margin-top:6px; font-size:19px; color:var(--text-dim);}
.phonebox{display:flex; justify-content:center;}
.phone{position:relative; width:360px; flex:none; margin:10px 0 20px; background:var(--bg);}
.phone .scr{padding:14px 16px 24px; pointer-events:none;}
.phone .frame{position:absolute; top:-10px; left:-10px; right:-10px; height:800px; border:10px solid var(--text);
  border-radius:36px; pointer-events:none; z-index:3;}
.phone .below{position:absolute; top:790px; left:-10px; right:-10px; bottom:0; z-index:2;
  background:color-mix(in srgb, var(--bg) 55%, transparent); border:2px dashed var(--line-strong); border-top:none; border-radius:0 0 24px 24px;}
.phone .below span{position:absolute; left:50%; top:10px; transform:translateX(-50%); white-space:nowrap;
  font-size:17px; font-weight:700; background:var(--text); color:var(--bg); padding:2px 12px; border-radius:var(--r-pill);}
.mock-bar{display:flex; justify-content:flex-end; min-height:44px; margin-bottom:-8px;}
.mock-bar span{display:inline-flex; align-items:center; min-height:48px; padding:8px 14px; border:1px solid var(--line);
  border-radius:var(--r-sm); background:var(--surface); color:var(--text-dim);}
.mock-hero{display:block; height:172px; width:auto; margin:4px auto 0;}
.mock-greet{font-size:24px; font-weight:700; letter-spacing:-.015em; line-height:1.25; text-align:center; margin-top:2px;}
.phone .card{margin:12px 0;}
.phone .btn{margin:8px 0;}
.mock-rank{font-size:27px; font-weight:700; letter-spacing:-.015em; line-height:1.2; margin-top:3px;}
.ticks{display:flex; align-items:flex-end; gap:2px; height:24px; margin:10px 0 8px;}
.ticks i{flex:1; height:50%; border-radius:2px; background:var(--tick-off);}
.ticks i.on{height:100%; background:var(--accent);}
.mstats{display:flex; gap:12px; border-top:1px solid var(--line); margin-top:13px; padding-top:12px;}
.mstats div{flex:1; min-width:0;}
.mstats b{display:block; font-family:var(--mono); font-size:30px; line-height:1.1; margin-top:4px;}
.tile{display:grid; grid-template-columns:72px 1fr; gap:4px 12px; align-items:center; padding:14px; margin:12px 0;
  border-radius:var(--r); border:2px solid var(--accent); background:var(--surface-2); box-shadow:var(--shadow);}
.tile img{grid-row:1 / span 2; width:72px; height:auto;}
.tile b{font-size:23px; line-height:1.15;}
.tile .tsub{font-size:18px; color:var(--text-dim); line-height:1.3;}
.tile .tcnt{grid-column:1 / -1; font-family:var(--mono); font-size:17px; color:var(--accent-text); font-weight:600; line-height:1.4; margin-top:6px;}
.newmark{outline:3px dashed var(--accent); outline-offset:3px;}
.mocknav{position:absolute; left:0; right:0; top:706px; height:74px; z-index:2; display:flex; gap:1px; align-items:center;
  background:var(--surface); border-top:1px solid var(--line); box-shadow:0 -6px 24px rgba(0,0,0,.10); padding:6px 4px 0;}
.mocknav span{flex:1 1 0; min-width:0; text-align:center; font-size:17px; color:var(--text-dim); letter-spacing:-.04em;
  min-height:62px; display:flex; align-items:center; justify-content:center; border-radius:14px;}
.mocknav span:first-child{color:var(--accent-text); font-weight:700; background:var(--surface-2);}
.note{margin-top:22px; font-size:19px; line-height:1.5;}
.note li{margin-top:6px;}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;}
  .lamp.on{transform:none;}
}
</style>

<div class="wrap">
  <p class="protoline">Прототип. Название рабочее. В приложение пока не встроено.</p>
  <div class="tabs" role="tablist" aria-label="Разделы">
    <button role="tab" id="t-play" aria-selected="true" aria-controls="tab-play">Играть</button>
    <button role="tab" id="t-all" aria-selected="false" aria-controls="tab-all">Все вопросы</button>
    <button role="tab" id="t-where" aria-selected="false" aria-controls="tab-where">Где в приложении</button>
  </div>

  <section id="tab-play" role="tabpanel" aria-labelledby="t-play">
    <div class="col">
      <div id="play"></div>
      <div id="settings" class="settings"></div>
    </div>
  </section>

  <section id="tab-all" role="tabpanel" aria-labelledby="t-all" hidden>
    <div class="col" id="all"></div>
  </section>

  <section id="tab-where" role="tabpanel" aria-labelledby="t-where" hidden>
    <div id="where"></div>
  </section>

el":"ru.wikipedia: Шиллинг, Павел Львович","url":"https://ru.wikipedia.org/wiki/Шиллинг,_Павел_Львович"}],"disputed":false},{"id":"s02","no":"4.2","text":"МОРЗЕ ОТПРАВИЛ ПЕРВУЮ ТЕЛЕГРАММУ","count":29,"year":1844,"q":"Что происходит?","right":"Первая весть по телеграфу","wrong":["Первое письмо авиапочтой","Первый разговор по телефону"],"tale":"24 мая 1844 года Сэмюэл Морзе отстучал из Капитолия в Балтимор строку из Библии «Что сотворил Бог» (What hath God wrought). Строку предложила юная Энни Эллсворт. Лента хранится в Библиотеке Конгресса.","links":[{"label":"Library of Congress","url":"https://www.loc.gov/item/today-in-history/may-24/"},{"label":"Smithsonian","url":"https://www.si.edu/object/what-hath-god-wrought-telegraph-message:nmah_713485"}],"disputed":false},{"id":"s03","no":"4.3","text":"ТЕЛЕГРАФ ПРОЛОЖЕН ПО ДНУ ОКЕАНА","count":27,"year":1858,"q":"Что происходит?","right":"Через океан заработал провод","wrong":["Через океан пошёл новый пароход","Над океаном пролетел самолёт"],"tale":"16 августа 1858 года королева Виктория и президент США Бьюкенен обменялись поздравлениями по кабелю через Атлантику. Кабель проработал всего около месяца. Надёжную связь дал новый кабель, уложенный в 1866 году с парохода «Грейт Истерн».","links":[{"label":"ru.wikipedia: Трансатлантический телеграфный кабель","url":"https://ru.wikipedia.org/wiki/Трансатлантический_телеграфный_кабель"}],"disputed":false},{"id":"s04","no":"4.4","text":"ПОПОВ ПОКАЗАЛ СВОЙ ПРИЕМНИК","count":24,"year":1895,"q":"Что происходит?","right":"Учёный показал новый прибор","wrong":["Учёный получил письмо","Учёный уехал в дальнюю экспедицию"],"tale":"7 мая 1895 года (25 апреля по старому стилю) Александр Попов показал на заседании Русского физико-химического общества прибор, который чуял электрические колебания на расстоянии. С тех пор 7 мая у нас празднуют День радио.","links":[{"label":"ru.wikipedia: День радио","url":"https://ru.wikipedia.org/wiki/День_радио"}],"disputed":false},{"id":"s05","no":"4.5","text":"СЛОВО ГЕРЦ ПРОШЛО БЕЗ ПРОВОДОВ","count":26,"year":1897,"q":"Что происходит?","right":"Слово передали по воздуху","wrong":["Слово написали на доске","Слово отправили обычной почтой"],"tale":"18 (30) декабря 1897 года Александр Попов при свидетелях передал азбукой Морзе без проводов слово «Герц» — в честь Генриха Герца, первооткрывателя радиоволн. Так учёный показал, что новый прибор способен передавать осмысленные сообщения на расстоянии без единого провода.","links":[{"label":"ru.wikipedia: Попов","url":"https://ru.wikipedia.org/wiki/Попов,_Александр_Степанович"},{"label":"Компьютерный музей","url":"https://www.computer-museum.ru/connect/radiojab.htm"},{"label":"СПбГУ","url":"https://spbu.ru/history/otkrytie-radio"}],"disputed":true},{"id":"s06","no":"4.6","text":"ЛЬДИНУ С РЫБАКАМИ УНОСИТ В МОРЕ","count":26,"year":1900,"q":"Что происходит?","right":"Рыбаки в беде на льдине","wrong":["Рыбаки вернулись с уловом","Рыбаки просят новые сети"],"tale":"6 февраля 1900 года в Финском заливе у острова Лавенсаари оторвало льдину с рыбаками. Весть передали по радиостанциям Попова на остров Гогланд, и ледокол «Ермак» вышел на поиски и снял рыбаков со льда. Это первое в России спасение на море с помощью радио.","links":[{"label":"Коммерсантъ","url":"https://www.kommersant.ru/doc/3211638"},{"label":"Родина","url":"https://rodina-history.ru/2025/02/06/125-let-nazad-aleksandr-popov-vpervye-v-mire-peredal-radiosignal-o-bedstvii-v-more.html"}],"disputed":false},{"id":"s07","no":"4.7","text":"МАРКОНИ ПРИНЯЛ СИГНАЛ ЧЕРЕЗ ОКЕАН","count":29,"year":1901,"q":"Что происходит?","right":"Сигнал впервые пересёк океан","wrong":["Сигнал не дошёл до другого берега","Корабль пересёк океан"],"tale":"12 декабря 1901 года Гульельмо Маркони на холме в Канаде слушал сигнал из Англии — три точки, букву S, переданную через океан. Он объявил, что принял этот сигнал, и весть о первой трансатлантической радиосвязи облетела мир.","links":[{"label":"IEEE ETHW","url":"https://ethw.org/Milestones:Reception_of_Transatlantic_Radio_Signals,_1901"},{"label":"Antique Wireless Assoc., PDF","url":"https://antiquewireless.org/wp-content/uploads/46-did_marconi_receive_transatlantic_radio_signals_in_1901.pdf"}],"disputed":true},{"id":"s08","no":"4.8","text":"СОС СТАЛ ОБЩИМ СИГНАЛОМ БЕДСТВИЯ","count":28,"year":1908,"q":"Что происходит?","right":"Общий сигнал беды для всех","wrong":["Сигналы беды отменили","Появился сигнал «всё хорошо»"],"tale":"Сигнал SOS утвердили на Берлинской конференции 1906 года, с 1 июля 1908 года он стал международным. Это не сокращение: «Спасите наши души» придумали потом. Выбрали его за то, что три точки, три тире, три точки ни с чем не спутаешь.","links":[{"label":"Wikipedia: SOS","url":"https://en.wikipedia.org/wiki/SOS"}],"disputed":false},{"id":"s09","no":"4.9","text":"РАДИСТ БИННС ЗОВЕТ НА ПОМОЩЬ","count":24,"year":1909,"q":"Что происходит?","right":"Радист вызывает спасателей","wrong":["Радист передаёт прогноз погоды","Радист сдаёт вахту"],"tale":"23 января 1909 года лайнер «Рипаблик» столкнулся с другим судном у берегов Америки. Радист Джек Биннс звал на помощь старым сигналом CQD и держал связь, пока не подошли спасатели. Это было первое большое спасение на море благодаря радио.","links":[{"label":"Wikipedia: Jack Binns","url":"https://en.wikipedia.org/wiki/Jack_Binns_(wireless_operator)"},{"label":"Wikipedia: CQD","url":"https://en.wikipedia.org/wiki/CQD"},{"label":"NTIA ITS","url":"https://its.ntia.gov/this-month-in-its-history/january-1909/"}],"disputed":false},{"id":"s10","no":"4.10","text":"ПАРОХОД АРАПАХО ПОДАЕТ СОС","count":23,"year":1909,"q":"Что происходит?","right":"Пароход просит о помощи","wrong":["Пароход прибыл в порт","Пароход поздравляет берег"],"tale":"В августе 1909 года у мыса Хаттерас пароход «Арапахо» подал SOS, первый такой сигнал у берегов Америки. Так SOS начал работать за три года до Титаника.","links":[{"label":"NC DNCR, Arapahoe 1909","url":"https://www.dncr.nc.gov/blog/2016/08/11/distress-signal-sos-first-heard-hatteras-1909"},{"label":"Snopes","url":"https://www.snopes.com/fact-check/titanic-first-sos/"}],"disputed":false},{"id":"s11","no":"4.11","text":"МЫ СТОИМ КРУГОМ ЛЕД","count":16,"year":1912,"q":"Что происходит?","right":"Судно остановилось во льдах","wrong":["Судно идёт полным ходом","Судно стоит в порту на ремонте"],"tale":"Вечером 14 апреля 1912 года радист парохода «Калифорниэн» предупредил Титаник: «Мы стоим, кругом лёд». Радист Титаника был занят телеграммами пассажиров и попросил не мешать. Около половины двенадцатого радист «Калифорниэна» выключил станцию и лёг спать.","links":[{"label":"Показания C. Evans, Сенат США","url":"https://www.titanicinquiry.org/USInq/AmInq08EvansCF01.php"},{"label":"Wikipedia: Jack Phillips","url":"https://en.wikipedia.org/wiki/Jack_Phillips_(wireless_operator)"}],"disputed":false},{"id":"s12","no":"4.12","text":"ТИТАНИК ТОНЕТ ИДИТЕ НА ПОМОЩЬ","count":25,"year":1912,"q":"Что происходит?","right":"Корабль в беде, зовёт помощь","wrong":["Корабль приглашает на праздник","Корабль пришёл в порт"],"tale":"В ночь на 15 апреля 1912 года радисты Титаника Джек Филлипс и Гарольд Брайд звали на помощь, чередуя старый сигнал CQD и новый SOS. Филлипс оставался на посту до конца.","links":[{"label":"Great Ships: журнал сигналов","url":"https://greatships.net/distress"},{"label":"Encyclopedia Titanica, заявление Брайда","url":"https://www.encyclopedia-titanica.org/statement-harold-bride.html"}],"disputed":false},{"id":"s13","no":"4.13","text":"КАРПАТИЯ ИДЕТ К ВАМ НА ПОМОЩЬ","count":24,"year":1912,"q":"Что происходит?","right":"Корабль спешит на помощь","wrong":["Корабль сам просит помощи","Корабль отказывается прийти"],"tale":"Радист «Карпатии» Гарольд Коттэм уже собирался спать, но задержался у приёмника и услышал Титаник. «Карпатия» повернула на помощь и подобрала всех, кто спасся.","links":[{"label":"Wikipedia: Harold Cottam","url":"https://en.wikipedia.org/wiki/Harold_Cottam"},{"label":"Great Ships","url":"https://greatships.net/distress"}],"disputed":false},{"id":"s14","no":"4.14","text":"ЛЮБИТЕЛИ СВЯЗАЛИСЬ ЧЕРЕЗ ОКЕАН","count":27,"year":1923,"q":"Что происходит?","right":"Любители поговорили через океан","wrong":["Любители не услышали друг друга","Любители встретились в порту"],"tale":"27 ноября 1923 года француз Леон Делуа (8AB) из Ниццы и американец Фред Шнелл из Хартфорда провели первую двустороннюю любительскую связь через Атлантику, телеграфом, на коротких волнах.","links":[{"label":"Wikipedia: Léon Deloy","url":"https://en.wikipedia.org/wiki/L%C3%A9on_Deloy"}],"disputed":false},{"id":"s15","no":"4.15","text":"РАДИОЛЮБИТЕЛЬ ЛБОВ ВЫШЕЛ В ЭФИР","count":27,"year":1925,"q":"Что происходит?","right":"Любитель начал передавать","wrong":["Любитель навсегда закрыл станцию","Любитель уехал из города"],"tale":"В ночь на 15 января 1925 года Фёдор Лбов из Нижнего Новгорода, позывной Р1ФЛ, передал: «Всем, всем! Здесь Р1ФЛ. Сообщите о слышимости». Первым отозвался слушатель из Ирака, за 2300 километров. Лбова называют первым отечественным радиолюбителем-коротковолновиком.","links":[{"label":"ru.wikipedia: Лбов, Фёдор Алексеевич","url":"https://ru.wikipedia.org/wiki/Лбов,_Фёдор_Алексеевич"}],"disputed":false},{"id":"s16","no":"4.16","text":"ШМИДТ ИЗ ВОХМЫ ПОЙМАЛ СОС НОБИЛЕ","count":27,"year":1928,"q":"Что происходит?","right":"Услышали сигнал бедствия","wrong":["Передали поздравление с праздником","Сломался приёмник"],"tale":"3 июня 1928 года в селе Вознесенье-Вохма молодой радиолюбитель Николай Шмидт поймал на самодельный одноламповый приёмник обрывки сигнала экипажа разбившегося дирижабля «Италия» генерала Нобиле. С этого начались поиски.","links":[{"label":"ru.wikipedia: Шмидт Н. Р.","url":"https://ru.wikipedia.org/wiki/Шмидт,_Николай_Рейнгольдович"},{"label":"ru.wikipedia: Экспедиция «Италия»","url":"https://ru.wikipedia.org/wiki/Экспедиция_на_дирижабле_«Италия»"}],"disputed":false},{"id":"s17","no":"4.17","text":"ЛЕДОКОЛ КРАСИН СПАС ЛЮДЕЙ НОБИЛЕ","count":28,"year":1928,"q":"Что происходит?","right":"Людей спасли со льда","wrong":["Людей ещё не нашли","Ледокол застрял во льдах"],"tale":"12 июля 1928 года ледокол «Красин» снял со льда группу экспедиции Нобиле, а перед этим лётчик Борис Чухновский отыскал людей с воздуха.","links":[{"label":"ru.wikipedia: Экспедиция «Италия»","url":"https://ru.wikipedia.org/wiki/Экспедиция_на_дирижабле_«Италия»"}],"disputed":false},{"id":"s18","no":"4.18","text":"КРЕНКЕЛЬ СВЯЗАЛСЯ С АНТАРКТИДОЙ","count":28,"year":1930,"q":"Что происходит?","right":"Радист говорит с Антарктидой","wrong":["Радист плывёт на корабле в Антарктиду","Радист потерял связь"],"tale":"12 января 1930 года Эрнст Кренкель из бухты Тихой на Земле Франца-Иосифа связался с американской базой в Антарктиде. Связь между противоположными концами Земли стала мировым рекордом дальности.","links":[{"label":"ru.wikipedia: Кренкель","url":"https://ru.wikipedia.org/wiki/Кренкель,_Эрнст_Теодорович"},{"label":"Индикатор","url":"https://indicator.ru/earth-science/ernst-krenkel.htm"}],"disputed":false},{"id":"s19","no":"4.19","text":"ЧЕЛЮСКИН РАЗДАВЛЕН ЛЮДИ НА ЛЬДУ","count":27,"year":1934,"q":"Что происходит?","right":"Судна нет, люди живут на льду","wrong":["Судно цело, все люди на борту","Люди дошли до берега"],"tale":"13 февраля 1934 года льды раздавили пароход «Челюскин», и 104 человека оказались на льдине. Эрнст Кренкель держал связь из лагеря Шмидта.","links":[{"label":"ru.wikipedia: Челюскин","url":"https://ru.wikipedia.org/wiki/Челюскин_(пароход)"},{"label":"ru.wikipedia: Кренкель","url":"https://ru.wikipedia.org/wiki/Кренкель,_Эрнст_Теодорович"}],"disputed":false},{"id":"s20","no":"4.20","text":"ЛЕТЧИКИ ВЫВЕЗЛИ ВСЕХ СО ЛЬДИНЫ","count":26,"year":1934,"q":"Что происходит?","right":"Всех спасли самолётами","wrong":["Люди ушли по льду пешком","Самолёты не смогли сесть"],"tale":"Весной 1934 года лётчики вывезли со льдины всех 104 челюскинцев. Семь лётчиков стали первыми Героями Советского Союза. Кренкель потом оставил позывной «Челюскина» RAEM своим, и в его честь каждый декабрь проходят соревнования RAEM Contest.","links":[{"label":"ru.wikipedia: Челюскин","url":"https://ru.wikipedia.org/wiki/Челюскин_(пароход)"},{"label":"RAEM Contest, СРР","url":"https://raem.srr.ru/about/"}],"disputed":false},{"id":"s21","no":"4.21","text":"СЕВЕРНЫЙ ПОЛЮС ВЫШЕЛ НА СВЯЗЬ","count":25,"year":1937,"q":"Что происходит?","right":"На полюсе заработала станция","wrong":["Полюс не отвечает","Над полюсом пролетел самолёт"],"tale":"21 мая 1937 года Эрнст Кренкель провёл первую радиосвязь с Северного полюса. Позывной станции «Северный полюс-1» был UPOL.","links":[{"label":"ru.wikipedia: Кренкель","url":"https://ru.wikipedia.org/wiki/Кренкель,_Эрнст_Теодорович"},{"label":"Wikipedia: North Pole-1","url":"https://en.wikipedia.org/wiki/North_Pole-1"}],"disputed":false},{"id":"s22","no":"4.22","text":"ЧКАЛОВ ЛЕТИТ ЧЕРЕЗ ПОЛЮС В АМЕРИКУ","count":29,"year":1937,"q":"Что происходит?","right":"Перелёт через полюс в Америку","wrong":["Перелёт из Америки обратно в Москву","Плавание вокруг Африки"],"tale":"18–20 июня 1937 года Чкалов, Байдуков и Беляков на самолёте АНТ-25 без посадки долетели из Москвы через Северный полюс в Ванкувер (США). В воздухе они были больше 63 часов.","links":[{"label":"ru.wikipedia: Перелёт Москва — Северный полюс — Ванкувер","url":"https://ru.wikipedia.org/wiki/Беспосадочный_перелёт_Москва_—_Северный_полюс_—_Ванкувер"}],"disputed":false},{"id":"s23","no":"4.23","text":"ПАПАНИНЦЕВ СНЯЛИ СО ЛЬДИНЫ","count":23,"year":1938,"q":"Что происходит?","right":"Полярников забрали с льдины","wrong":["Полярники высадились на льдину","Полярники зимуют дальше"],"tale":"19 февраля 1938 года четверых папанинцев сняли со льдины. Станция «Северный полюс-1» дрейфовала 274 дня.","links":[{"label":"ААНИИ","url":"https://www.aari.ru/press-center/news/severnyy-polyus-41-(lsp)/19-fevralya-uspeshno-zavershilas-pervaya-ekspeditsiya-%C2%ABsevernyy-polyus%C2%BB"},{"label":"Wikipedia: North Pole-1","url":"https://en.wikipedia.org/wiki/North_Pole-1"}],"disputed":false},{"id":"s24","no":"4. // ——— Тайминг: перенесено из app/js/timing.js без изменений формул ———
function clampEff(e, c){ return Math.min(e, c); }
function cpm(w){ return Math.round(w * 5); }
function charTiming(C, Eraw){
  const E = clampEff(Eraw, C), dit = 1.2 / C;
  let charGap, wordGap;
  if (E >= C){ charGap = 3 * dit; wordGap = 7 * dit; }
  else { const ta = (60 * C - 37.2 * E) / (C * E); const f = ta / 19; charGap = 3 * f; wordGap = 7 * f; }
  return { dit, dah: 3 * dit, intraGap: dit, charGap, wordGap };
}
function codeToSchedule(code, C, E){
  const t = charTiming(C, E), seq = [];
  for (let i = 0; i < code.length; i++){
    seq.push({ tone: true, dur: code[i] === '.' ? t.dit : t.dah });
    if (i < code.length - 1) seq.push({ tone: false, dur: t.intraGap });
  }
  return seq;
}
const glyph = (ch) => ch === '0' ? 'Ø' : ch;
const showText = (s) => s.split('').map(glyph).join('');
const codeText = (code) => code.replace(/\./g, '·').replace(/-/g, '–');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

// ——— Звук: как app/js/audio.js (синус 600 Гц, громкость 0,5, фронты 5 мс) ———
const ATTACK = 0.005, RELEASE = 0.005, TONE = 600, VOLUME = 0.5;
let ctx = null, activeStops = [], rafId = null, generation = 0;
function ensureAudio(){
  try {
    if (navigator.audioSession) { try { navigator.audioSession.type = 'playback'; } catch (e) {} }
    if (!ctx){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); }
    if (ctx.state !== 'running'){ const p = ctx.resume(); if (p && p.catch) p.catch(() => {}); }
  } catch (e) { ctx = null; }
  return ctx;
}
function whenRunning(c, fn){
  if (c.state === 'running'){ fn(true); return; }
  let waited = 0;
  const poll = () => {
    if (c.state === 'running'){ fn(true); return; }
    waited += 50;
    if (waited >= 1500){ fn(false); return; }
    setTimeout(poll, 50);
  };
  setTimeout(poll, 50);
}
function stopAll(){
  generation++;
  for (const s of activeStops.splice(0)) { try { s(); } catch (e) {} }
  if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
}
function scheduleTone(t0, dur){
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = 'sine'; osc.frequency.value = TONE;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(VOLUME, t0 + ATTACK);
  g.gain.setValueAtTime(VOLUME, t0 + Math.max(ATTACK, dur - RELEASE));
  g.gain.linearRampToValueAtTime(0, t0 + dur);
  osc.connect(g).connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.01);
  const stop = () => { try { osc.stop(); } catch (e) {} };
  activeStops.push(stop);
  osc.onended = () => { activeStops = activeStops.filter((s) => s !== stop); };
}
// Треск эфира: шум из кода, без файлов. Тихий, полосой как у приёмника.
let noiseBuf = null;
function scheduleCrackle(t0, t1){
  if (!noiseBuf){
    const n = ctx.sampleRate * 2; noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < n; i++){
      let v = (Math.random() * 2 - 1) * 0.35;
      if (Math.random() < 0.0006) v += (Math.random() * 2 - 1) * 2.2;   // щелчки
      d[i] = v;
    }
  }
  const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.6;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.09, t0 + 0.15);
  g.gain.setValueAtTime(0.09, t1); g.gain.linearRampToValueAtTime(0, t1 + 0.3);
  src.connect(bp).connect(g).connect(ctx.destination);
  src.start(t0); src.stop(t1 + 0.35);
  const stop = () => { try { src.stop(); } catch (e) {} };
  activeStops.push(stop);
  src.onended = () => { activeStops = activeStops.filter((s) => s !== stop); };
}
function speedFor(slow){
  if (window.__FAST) return { charWpm: 400, effWpm: 400 };   // только для автопроверки
  const eff = S.settings.eff, charWpm = Math.max(18, eff);
  // «Медленнее» — приём L.slow из «Учиться»: паузы длиннее на 3 WPM, не ниже 5
  // (и не быстрее обычного, если скорость уже ниже 5).
  const effWpm = slow ? Math.min(eff, clampEff(Math.max(5, eff - 3), charWpm)) : eff;
  return { charWpm, effWpm };
}
// Проиграть текст. onFlash(on), onChar(i|null) — в такт звуку; onDone(awake).
function playText(text, { slow = false, onFlash, onChar, onDone } = {}){
  const c = ensureAudio();
  if (!c){ if (onDone) onDone(true); return; }
  stopAll();
  const mine = ++generation;
  whenRunning(c, (awake) => {
    if (mine !== generation) return;
    if (!awake){ if (onFlash) onFlash(false); if (onDone) onDone(false); return; }
    const { charWpm, effWpm } = speedFor(slow);
    const tm = charTiming(charWpm, effWpm);
    const start = c.currentTime + 0.1;
    let t = start;
    const ev = [];
    let li = -1;
    for (const ch of text){
      if (ch === ' '){ t += tm.wordGap; continue; }
      const code = CODES[ch]; if (!code) continue;
      li++;
      ev.push({ time: t, ch: li });
      for (const seg of codeToSchedule(code, charWpm, effWpm)){
        if (seg.tone){ scheduleTone(t, seg.dur); ev.push({ time: t, on: true }); ev.push({ time: t + seg.dur, on: false }); }
        t += seg.dur;
      }
      t += tm.charGap;
    }
    const end = t;
    if (S.settings.crackle) scheduleCrackle(Math.max(c.currentTime, start - 0.1), end);
    ev.sort((a, b) => a.time - b.time);
    let i = 0;
    const tick = () => {
      if (mine !== generation) return;
      const now = c.currentTime;
      while (i < ev.length && ev[i].time <= now){
        const e = ev[i++];
        if ('ch' in e){ if (onChar) onChar(e.ch); } else if (onFlash) onFlash(e.on);
      }
      if (now >= end){ if (onFlash) onFlash(false); if (onChar) onChar(null); if (onDone) onDone(true); return; }
      rafId = requestAnimationFrame(tick);
    };
    rafId = requestAnimationFrame(tick);
  });
}

// DECK-BEGIN — колода без повторов (правило из концепта). Чистые функции, проверяются в Node.
function deckFresh(){ return { seen: [], last: null, solved: [] }; }
function deckClean(raw, ids){
  const d = deckFresh(); if (!raw || typeof raw !== 'object') return d;
  const ok = (x) => ids.includes(x);
  d.seen = Array.isArray(raw.seen) ? [...new Set(raw.seen.filter(ok))] : [];
  d.solved = Array.isArray(raw.solved) ? [...new Set(raw.solved.filter(ok))] : [];
  d.last = ok(raw.last) ? raw.last : null;
  return d;
}
// Взять следующий вопрос. roundShown — что уже показано в этом раунде: если круг
// кончился посреди раунда, эти вопросы тоже не могут выпасть снова.
function deckDraw(d, ids, roundShown, rnd){
  let pool = ids.filter((x) => !d.seen.includes(x) && !roundShown.includes(x));
  if (!pool.length){
    d.seen = [];
    pool = ids.filter((x) => x !== d.last && !roundShown.includes(x));
    if (!pool.length) pool = ids.filter((x) => x !== d.last);
  }
  const id = pool[Math.floor(rnd() * pool.length)];
  d.seen.push(id); d.last = id;
  return id;
}
function shuffle(arr, rnd){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

const KEY = 'chto-peredali-proto-v1';
const S = { decks: {}, settings: { eff: 9, crackle: false, theme: 'auto' } };
function load(){
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { raw = null; }
  for (const c of CATS) S.decks[c.id] = deckClean(raw && raw.decks && raw.decks[c.id], idsOf(c.id));
  const st = raw && raw.settings || {};
  if (Number.isFinite(st.eff)) S.settings.eff = Math.min(30, Math.max(5, Math.round(st.eff)));
  S.settings.crackle = st.crackle === true;
  if (['auto', 'light', 'dark'].includes(st.theme)) S.settings.theme = st.theme;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const hostTheme = document.documentElement.getAttribute('data-theme');

  const t = S.settings.theme, root = document.documentElement;
  if (t === 'auto'){ if (hostTheme) root.setAttribute('data-theme', hostTheme); else root.removeAttribute('data-theme'); }

}

  gear: (s) => svg('<circle cx="12" cy="12" r="3"/><path d="M10.4 2.9h3.2l.35 2.2 1.9.8 1.8-1.3 2.25 2.25-1.3 1.8.8 1.9 2.2.35v3.2l-2.2.35-.8 1.9 1.3 1.8-2.25 2.25-1.8-1.3-1.9.8-.35 2.2h-3.2l-.35-2.2-1.9-.8-1.8 1.3L3.4 18.15l1.3-1.8-.8-1.9-2.2-.35v-3.2l2.2-.35.8-1.9-1.3-1.8L5.65 4.6l1.8 1.3 1.9-.8z"/>', s),
  stop: (s) => svg('<rect x="7" y="7" width="10" height="10" rx="1.5"/>', s),
};
const traceHTML = (code) => code.split('').map((c) => `<i class="${c === '.' ? 'dit' : 'dah'}"></i>`).join('<i class="g"></i>');
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

// ═════════════════════ Играть ═════════════════════
const ROUND = 5;
let R = null;      // текущий раунд
let view = 'cats';
const $ = (sel) => document.querySelector(sel);

function renderPlay(){
  stopAll();
  if (view === 'cats') return renderCats();
  if (view === 'q') return renderQuestion();
  if (view === 'end') return renderEnd();
}

function renderCats(){
  $('#play').innerHTML = `
    <div class="intro">
      <img src="${BONYA}" alt="">
      <div><h2>Что передали?</h2>
      <p class="muted">Боня передаст пять сообщений. Разберите и выберите ответ.</p></div>
    </div>
    <div class="cats">
      ${CATS.map((c) => `
        <button class="cat" data-cat="${c.id}" id="cat-${c.id}">
          <span class="nm">${c.name}${c.tag ? `<span class="tag">${c.tag}</span>` : ''}</span>
          <span class="cnt">${S.decks[c.id].solved.length} из ${DATA[c.id].length} ›</span>
          <span class="sub">${c.sub}</span>
        </button>`).join('')}
    </div>
    <p class="hint">«12 из 30» — сколько разных вопросов разгадано хотя бы раз.</p>`;
  document.querySelectorAll('.cat').forEach((b) => b.addEventListener('click', () => startRound(b.dataset.cat)));
}

function startRound(cat){
  R = { cat, shown: [], results: [], q: null };
  nextQuestion();
}
function nextQuestion(){
  if (R.shown.length >= ROUND){ view = 'end'; renderPlay(); return; }
  const id = deckDraw(S.decks[R.cat], idsOf(R.cat), R.shown, Math.random);
  R.shown.push(id);
  save();
  const q = qById(R.cat, id);
  R.q = { q, opts: shuffle([q.right, ...q.wrong], Math.random), wrong: [], heard: false, done: false,
          firstTry: true, slow: false, code: false, abc: false, playing: false, msg: 'Нажмите «Слушать».', msgKind: '' };
  view = 'q';
  renderPlay();
  window.scrollTo(0, 0);
}

function renderQuestion(){
  const Q = R.q, q = Q.q, cat = catById(R.cat);
  let li = -1;
  const words = q.text.split(' ').map((w) => `<span class="mword">${w.split('').map((ch) => {
    li++;
    return `<span class="mcell" data-i="${li}"><span class="ch">${Q.done ? esc(glyph(ch)) : ''}</span>${Q.code ? `<span class="cd" aria-label="${codeText(CODES[ch])}">${traceHTML(CODES[ch])}</span>` : ''}</span>`;
  }).join('')}</span>`).join('');
  const letters = [...new Set(q.text.replace(/ /g, '').split(''))].sort((a, b) => a.localeCompare(b, 'ru'));
  const opts = R.cat === 'word'
    ? `<div class="pics" id="opts">${Q.opts.map((o, i) => `<button class="pic" data-o="${esc(o)}" aria-label="Картинка ${i + 1}" ${Q.wrong.includes(o) ? 'disabled' : ''}>${picSVG(o, 72)}</button>`).join('')}</div>`
    : `<div class="opts" id="opts">${Q.opts.map((o) => `<button class="opt" data-o="${esc(o)}" ${Q.wrong.includes(o) ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
  $('#play').innerHTML = `
    <div class="screenbar">
      <button class="iconbtn" id="back">${ICON.back(22)} Назад</button>
      <div class="title"><b>${cat.name}</b><span class="counter">${R.shown.length} из ${ROUND}</span></div>
    </div>
    <p class="question">${esc(q.q)}</p>
    <div class="lamp" id="lamp" aria-hidden="true"></div>
    <div class="msgline ${Q.done ? 'solved' : ''} ${Q.code ? 'withcode' : ''}" id="cells" aria-label="${Q.done ? esc(showText(q.text)) : 'Клеточки по числу букв'}">${words}</div>
    ${Q.done ? revealHTML() : `
    <div class="feedback ${Q.msgKind}" id="fb" role="status">${Q.msg}</div>
    <div class="controls">
      <button class="btn" id="listen">${Q.heard ? ICON.replay(24) + ' Ещё раз' : ICON.play(24) + ' Слушать'}</button>
      <div class="btn-row">
        <button class="btn secondary" id="slow" aria-pressed="${Q.slow}">Медленнее</button>
        <button class="btn secondary" id="code" aria-pressed="${Q.code}">${Q.code ? 'Скрыть точки-тире' : 'Показать точки-тире'}</button>
      </div>
      ${Q.code ? `<div class="abc">
        <button class="linkbtn" id="abc" aria-expanded="${Q.abc}">${Q.abc ? 'Скрыть азбуку' : 'Азбука для этого сообщения'}</button>
        ${Q.abc ? `<div class="abcgrid">${letters.map((ch) => `<div>${esc(glyph(ch))}<small>${codeText(CODES[ch])}</small></div>`).join('')}</div>` : ''}
      </div>` : ''}
    </div>
    ${Q.heard ? opts : ''}`}`;
  $('#back').addEventListener('click', () => { stopAll(); view = 'cats'; renderPlay(); });
  if (Q.done){
    $('#rlisten').addEventListener('click', () => listen(false));
    $('#rnext').addEventListener('click', nextQuestion);
    return;
  }
  $('#listen').addEventListener('click', () => listen(true));
  $('#slow').addEventListener('click', () => { Q.slow = !Q.slow; renderQuestion(); });
  $('#code').addEventListener('click', () => { Q.code = !Q.code; if (!Q.code) Q.abc = false; renderQuestion(); });
  if (Q.code) $('#abc').addEventListener('click', () => { Q.abc = !Q.abc; renderQuestion(); });
  document.querySelectorAll('#opts button').forEach((b) => b.addEventListener('click', () => answer(b.dataset.o)));
}

function setFb(text, kind){
  const Q = R.q; Q.msg = text; Q.msgKind = kind || '';
  const fb = $('#fb'); if (fb){ fb.textContent = text; fb.className = 'feedback ' + Q.msgKind; }
}
function listen(inQuestion){
  const Q = R.q;
  if (inQuestion) setFb('Слушайте…');
  const lamp = $('#lamp');
  playText(Q.q.text, {
    slow: Q.slow,
    onFlash: (on) => { const l = $('#lamp'); if (l) l.classList.toggle('on', !!on); },
    onChar: (i) => {
      document.querySelectorAll('.mcell.now').forEach((c) => c.classList.remove('now'));
      if (i !== null){ const c = document.querySelector(`.mcell[data-i="${i}"]`); if (c) c.classList.add('now'); }
    },
    onDone: (awake) => {
      if (R.q !== Q) return;
      if (!awake){ setFb('Звук не включился. Нажмите «Слушать» ещё раз.', 'no'); return; }
      if (Q.done) return;
      const first = !Q.heard;
      Q.heard = true;
      Q.msg = Q.wrong.length ? 'Не то. Послушайте ещё раз.' : 'Что передали? Выберите ответ.';
      Q.msgKind = Q.wrong.length ? 'no' : '';
      if (first) renderQuestion();
      else setFb(Q.msg, Q.msgKind);
    },
  });
}
function answer(o){
  const Q = R.q;
  if (Q.done || !Q.heard) return;
  if (o === Q.q.right){ finish(true); return; }
  Q.firstTry = false;
  if (!Q.wrong.includes(o)) Q.wrong.push(o);
  Q.msg = 'Не то. Послушайте ещё раз.'; Q.msgKind = 'no';
  if (Q.opts.filter((x) => !Q.wrong.includes(x)).length <= 1){ finish(false); return; }
  renderQuestion();
  const f = $('#fb'); if (f) f.focus && f.focus();
}
function finish(pickedRight){
  stopAll();
  const Q = R.q;
  Q.done = true; Q.pickedRight = pickedRight;
  R.results.push(Q.firstTry);
  const d = S.decks[R.cat];
  if (!d.solved.includes(Q.q.id)) d.solved.push(Q.q.id);
  save();
  renderQuestion();
}
function revealHTML(){
  const Q = R.q, q = Q.q, last = R.shown.length >= ROUND;
  const verdict = Q.pickedRight
    ? `<div class="verdict">${ICON.check(30)} Верно!</div>`
    : `<div class="verdict soft">Остался один ответ — он и верный.</div>`;
  let extra = '';
  if (R.cat === 'word') extra = `<div class="revpic">${picSVG(q.right, 104)}<span>${esc(cap(q.right))}</span></div>`;
  else extra = `<p style="font-size:22px;font-weight:650">${esc(q.right)}</p>`;
  if (R.cat === 'story') extra += `
    <div class="story card">
      <span class="yr">${q.year}</span>
      <p>${q.tale}</p>
    </div>`;
  return `<div class="reveal" id="reveal">
    ${verdict}
    <div class="bigtext">${esc(showText(q.text))}</div>
    ${extra}
    <div class="btn-row">
      <button class="btn secondary" id="rlisten">${ICON.play(22)} Послушать</button>
      <button class="btn" id="rnext">${last ? 'Итог раунда' : 'Дальше'} ${ICON.next(22)}</button>
    </div>
  </div>`;
}
function renderEnd(){
  const n = R.results.filter(Boolean).length;
  $('#play').innerHTML = `
    <div class="card endcard">
      <div class="eyebrow">${catById(R.cat).name}</div>
      <h2 style="margin-top:6px">Раунд пройден</h2>
      <div class="dots" aria-hidden="true">${R.results.map((r) => `<i class="${r ? 'ok' : ''}"></i>`).join('')}</div>
      <p class="muted">С первой попытки</p>
      <div class="score">${n} из ${R.results.length}</div>
      <p class="muted">Разгадано в этой категории: ${S.decks[R.cat].solved.length} из ${DATA[R.cat].length}</p>
    </div>
    <div class="stack" style="margin-top:14px">
      <button class="btn" id="again">Ещё раунд</button>
      <button class="btn secondary" id="tocats">К категориям</button>
    </div>`;
  $('#again').addEventListener('click', () => startRound(R.cat));
  $('#tocats').addEventListener('click', () => { view = 'cats'; renderPlay(); });
}

// ——— Настройки ———
let confirmOpen = false;
function renderSettings(){
  const s = S.settings;
  $('#settings').innerHTML = `
    <div class="card">
      <div class="eyebrow" style="margin-bottom:6px">${ICON.gear(20)} Настройки</div>
      <div class="setrow">
        <span class="lbl" id="speed-lbl">Скорость передачи</span>
        <div class="speed" role="group" aria-labelledby="speed-lbl">
          <button class="btn secondary" id="sp-minus" ${s.eff <= 5 ? 'disabled' : ''}>− Медленнее</button>
          <output id="sp-val">${cpm(s.eff)}<small>зн/мин</small></output>
          <button class="btn secondary" id="sp-plus" ${s.eff >= 30 ? 'disabled' : ''}>+ Быстрее</button>
        </div>
        <p class="hint">Как в «Учиться»: сами знаки звучат на ${cpm(Math.max(18, s.eff))} зн/мин, а паузы между ними растянуты. По умолчанию 45.</p>
      </div>
      <div class="setrow rowflex">
        <span class="lbl" id="cr-lbl" style="margin:0">Треск эфира</span>
        <button class="toggle" id="crackle" role="switch" aria-checked="${s.crackle}" aria-labelledby="cr-lbl"><i></i></button>
      </div>
      <div class="setrow">
        <span class="lbl" id="th-lbl">Оформление</span>
        <div class="seg" role="group" aria-labelledby="th-lbl">
          <button data-th="auto" aria-pressed="${s.theme === 'auto'}">Как в телефоне</button>
          <button data-th="light" aria-pressed="${s.theme === 'light'}">Светлое</button>
          <button data-th="dark" aria-pressed="${s.theme === 'dark'}">Тёмное</button>
        </div>
      </div>
    </div>
    ${confirmOpen ? `<div class="confirm" id="confirm">
        <p>Все счётчики «из 30» обнулятся, вопросы пойдут по кругу заново. Начать заново?</p>
        <div class="btn-row">
          <button class="btn" id="reset-yes">Да, заново</button>
          <button class="btn secondary" id="reset-no">Отмена</button>
        </div>
      </div>`
      : `<button class="linkbtn danger" id="reset">Начать заново</button>`}`;
  $('#sp-minus').addEventListener('click', () => { s.eff = Math.max(5, s.eff - 1); save(); renderSettings(); });
  $('#sp-plus').addEventListener('click', () => { s.eff = Math.min(30, s.eff + 1); save(); renderSettings(); });
  $('#crackle').addEventListener('click', () => { s.crackle = !s.crackle; save(); renderSettings(); });
  document.querySelectorAll('[data-th]').forEach((b) => b.addEventListener('click', () => {
    s.theme = b.dataset.th; save(); applyTheme(); renderSettings();
  }));
  if (confirmOpen){
    $('#reset-yes').addEventListener('click', () => {
      for (const c of CATS) S.decks[c.id] = deckFresh();
      save(); confirmOpen = false; stopAll(); view = 'cats'; renderPlay(); renderSettings();
    });
    $('#reset-no').addEventListener('click', () => { confirmOpen = false; renderSettings(); });
  } else {
    $('#reset').addEventListener('click', () => { confirmOpen = true; renderSettings(); });
  }
}

// ═════════════════════ Все вопросы ═════════════════════
let listPlaying = null;
function renderAll(){
  const block = (c) => `
    <div class="qcat" id="all-${c.id}">
      <h2>${c.name} <small>${DATA[c.id].length} вопросов</small></h2>
      <ul class="qlist">${DATA[c.id].map((q) => `
        <li class="card qitem">
          <button class="play" data-play="${c.id}:${q.id}" aria-pressed="false" aria-label="Послушать ${q.no}">${ICON.play(24)}</button>
          <span class="no">${q.no} · ${q.count} знаков${q.year ? ' · ' + q.year : ''}</span>
          <span class="tx">${esc(showText(q.text))}</span>
          <span class="ans">
            <span class="muted">${esc(q.q)}</span><br>
            <span class="r">✓ ${esc(q.right)}</span><br>
            <span class="w">✗ ${q.wrong.map(esc).join(' · ')}</span>
          </span>
          ${c.id === 'word' ? `<div class="more minipics">${[q.right, ...q.wrong].map((p, i) => `<span class="${i ? '' : 'r'}">${picSVG(p, 48)}${esc(p)}</span>`).join('')}</div>` : ''}
          ${c.id === 'story' ? `<div class="more"><p>${q.tale}</p></div>` : ''}
        </li>`).join('')}
      </ul>
    </div>`;
  $('#all').innerHTML = `
    <h2>Все 120 вопросов</h2>
    <p class="muted" style="margin:6px 0 12px">Здесь всё открыто, чтобы найти неудачные вопросы. ▶ проигрывает текст на текущей скорости и в игре не засчитывается.</p>
    <div class="jump">${CATS.map((c) => `<button class="btn secondary" data-jump="${c.id}">${c.name}</button>`).join('')}</div>
    ${CATS.map(block).join('')}`;
  document.querySelectorAll('[data-jump]').forEach((b) => b.addEventListener('click', () => {
    document.getElementById('all-' + b.dataset.jump).scrollIntoView({ behavior: 'smooth', block: 'start' });
  }));
  document.querySelectorAll('[data-play]').forEach((b) => b.addEventListener('click', () => {
    const [cat, id] = b.dataset.play.split(':');
    const was = listPlaying === b;
    resetListButtons();
    if (was){ stopAll(); return; }
    listPlaying = b; b.setAttribute('aria-pressed', 'true'); b.innerHTML = ICON.stop(24);
    playText(qById(cat, id).text, { onDone: () => { if (listPlaying === b) resetListButtons(); } });
  }));
}
function resetListButtons(){
  if (listPlaying){ listPlaying.setAttribute('aria-pressed', 'false'); listPlaying.innerHTML = ICON.play(24); }
  listPlaying = null;
}

function renderWhere(){
  const ticks = Array.from({ length: 32 }, (_, i) => `<i class="${i < 21 ? 'on' : ''}"></i>`).join('');

    <div class="phonebox"><div class="phone" data-phone aria-label="Макет главного экрана, вариант ${variant}">

        </div>
        <div class="btn">Продолжить обучение</div>

      </div>
      <div class="mocknav"><span>Главная</span><span>Учиться</span><span>Ключ</span><span>Азбука</span><span>Журнал</span></div>
      <div class="frame"></div>

    </div>

      <div>
        <div class="vhead"><h3>Вариант А <span class="badge">рекомендую</span></h3>
          <p>Под «Повторением пройденного». Главной кнопкой остаётся «Продолжить обучение». Карточка видна только после прокрутки.</p></div>
        ${phone('А')}
      </div>
      <div>
        <div class="vhead"><h3>Вариант Б</h3>
          <p>Сразу под «Продолжить обучение». Над нижним меню виден верх карточки, остальное — после прокрутки. «Повторение» уезжает вниз.</p></div>
        ${phone('Б')}
      </div>
    </div>
    <div class="col note">
      <p><b>Что решить:</b> какое место лучше (открытый вопрос 3 в концепте).</p>
      <ul>
        <li>Снято с настоящей главной на телефоне 360×780: «Продолжить обучение» кончается чуть выше нижнего меню, а «Повторение пройденного» уже под ним.</li>

        <li>Нажатие на карточку откроет выбор категории — тот экран, что во вкладке «Играть».</li>
      </ul>
    </div>`;
  fitPhones();
}
// На узком экране макет уменьшается целиком, чтобы край экрана оставался на своём месте.
function fitPhones(){
  document.querySelectorAll('[data-phone]').forEach((ph) => {
    const avail = ph.parentElement.clientWidth || 380;
    ph.style.zoom = String(Math.min(1, (avail - 4) / 380));
  });
}
window.addEventListener('resize', fitPhones);

// ═════════════════════ Разделы ═════════════════════
const TABS = ['play', 'all', 'where'];
function showTab(name){
  stopAll(); resetListButtons();
  for (const t of TABS){
    $('#t-' + t).setAttribute('aria-selected', String(t === name));
    $('#tab-' + t).hidden = t !== name;
  }
  if (name === 'play') renderPlay();
  if (name === 'where') fitPhones();
  try { localStorage.setItem(KEY + '-tab', name); } catch (e) {}
}
TABS.forEach((t) => $('#t-' + t).addEventListener('click', () => showTab(t)));

load();
applyTheme();
renderSettings();
renderAll();
renderWhere();
let startTab = 'play';
try { const v = localStorage.getItem(KEY + '-tab'); if (TABS.includes(v)) startTab = v; } catch (e) {}
if (TABS.includes(location.hash.slice(1))) startTab = location.hash.slice(1);
showTab(startTab);
</script>
